[project]
name = "textsql"
version = "0.1.0"
description = "Agente text-to-SQL em português sobre o dataset Olist (e-commerce)"
authors = [
    { name = "João Ramos", email = "joao.henriqueramos99@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=2.0.0",
    "kagglehub>=1.0.3",
    "openai>=3.52.0",
    "pandas>=3.1.1",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "sqlglot>=30.33.0",
]

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
