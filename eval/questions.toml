# Conjunto de avaliação do agente.
#
# Cada pergunta tem um SQL de referência, escrito e conferido à mão. A avaliação compara o
# RESULTADO do SQL do agente com o resultado da referência (não o texto do SQL):
# - colunas extras do agente são aceitas; nomes de coluna são ignorados;
# - a ordem das linhas só conta se `ordered = true`;
# - números com tolerância de 0,1% (ou 0,01 absoluto).
#
# Campos:
#   id        identificador estável (usado no relatório)
#   category  contagem | agregacao | ranking | temporal | pegadinha | recusa
#   question  a pergunta, como um usuário escreveria
#   sql       referência; lista quando a pergunta admite mais de uma leitura correta
#   ordered   a ordem das linhas faz parte da resposta (rankings, séries no tempo)
#   expect    "refusal" para perguntas que o agente deve recusar (SEM_SQL ou bloqueio)
#
# Referências devolvem só as colunas que importam: o agente pode trazer colunas a mais
# (ex.: o nome da categoria em português e em inglês) sem ser penalizado.

# --- contagem --------------------------------------------------------------------------------

[[question]]
id = "total_pedidos"
category = "contagem"
question = "Quantos pedidos existem no total?"
sql = "SELECT count(*) FROM orders"

[[question]]
id = "pedidos_entregues"
category = "contagem"
question = "Quantos pedidos foram entregues?"
sql = "SELECT count(*) FROM orders WHERE order_status = 'delivered'"

[[question]]
id = "pedidos_cancelados"
category = "contagem"
question = "Quantos pedidos foram cancelados?"
sql = "SELECT count(*) FROM orders WHERE order_status = 'canceled'"

[[question]]
id = "vendedores"
category = "contagem"
question = "Quantos vendedores existem na base?"
sql = "SELECT count(*) FROM sellers"

[[question]]
id = "produtos_vendidos"
category = "contagem"
question = "Quantos produtos diferentes já foram vendidos?"
# "vendido" admite duas leituras: qualquer item de pedido, ou só pedidos entregues
# (regra de "vendas" nas notas do schema). As duas estão certas.
sql = [
    "SELECT count(DISTINCT product_id) FROM order_items",
    """SELECT count(DISTINCT oi.product_id) FROM order_items oi JOIN orders o USING (order_id)
       WHERE o.order_status = 'delivered'""",
]

# --- agregação --------------------------------------------------------------------------------

[[question]]
id = "nota_media"
category = "agregacao"
question = "Qual a nota média das avaliações?"
sql = "SELECT round(avg(review_score), 2) FROM order_reviews"

[[question]]
id = "frete_medio_item"
category = "agregacao"
question = "Qual o valor médio do frete por item vendido?"
# mesma ambiguidade de "vendido" (ver produtos_vendidos)
sql = [
    "SELECT round(avg(freight_value), 2) FROM order_items",
    """SELECT round(avg(oi.freight_value), 2) FROM order_items oi JOIN orders o USING (order_id)
       WHERE o.order_status = 'delivered'""",
]

[[question]]
id = "ticket_medio"
category = "agregacao"
question = "Qual o ticket médio dos pedidos entregues, somando preço e frete dos itens?"
sql = """
SELECT round(avg(total), 2) FROM (
    SELECT oi.order_id, sum(oi.price + oi.freight_value) AS total
    FROM order_items oi JOIN orders o USING (order_id)
    WHERE o.order_status = 'delivered'
    GROUP BY oi.order_id
)
"""

[[question]]
id = "itens_por_pedido"
category = "agregacao"
question = "Em média, quantos itens tem um pedido?"
sql = """
SELECT round(avg(n), 2) FROM (SELECT order_id, count(*) AS n FROM order_items GROUP BY order_id)
"""

[[question]]
id = "peso_medio_kg"
category = "agregacao"
question = "Qual o peso médio dos produtos, em kg?"
sql = "SELECT round(avg(product_weight_g) / 1000, 2) FROM products"

[[question]]
id = "tempo_entrega"
category = "agregacao"
question = "Qual o tempo médio de entrega, em dias, dos pedidos entregues?"
# "dias" admite duas leituras: diferença de datas no calendário ou tempo decorrido / 24h
sql = [
    """SELECT round(avg(date_diff('day', order_purchase_timestamp, order_delivered_customer_date)), 2)
       FROM orders WHERE order_status = 'delivered' AND order_delivered_customer_date IS NOT NULL""",
    """SELECT round(avg(epoch(order_delivered_customer_date - order_purchase_timestamp)) / 86400, 2)
       FROM orders WHERE order_status = 'delivered' AND order_delivered_customer_date IS NOT NULL""",
]

[[question]]
id = "receita_por_pagamento"
category = "agregacao"
question = "Qual o valor total pago por tipo de pagamento?"
sql = """
SELECT payment_type, round(sum(payment_value), 2) FROM order_payments GROUP BY payment_type
"""

# --- ranking ----------------------------------------------------------------------------------

[[question]]
id = "top_categorias_receita"
category = "ranking"
question = "Quais as 5 categorias de produto com maior receita (soma dos preços) em pedidos entregues? Use o nome em inglês."
ordered = true
sql = """
SELECT t.product_category_name_english, round(sum(oi.price), 2) AS receita
FROM order_items oi
JOIN orders o USING (order_id)
JOIN products p USING (product_id)
LEFT JOIN category_translation t USING (product_category_name)
WHERE o.order_status = 'delivered'
GROUP BY 1 ORDER BY receita DESC LIMIT 5
"""

[[question]]
id = "top_estados_clientes"
category = "ranking"
question = "Quais os 5 estados com mais clientes únicos?"
ordered = true
sql = """
SELECT customer_state, count(DISTINCT customer_unique_id) AS n
FROM customers GROUP BY 1 ORDER BY n DESC LIMIT 5
"""

[[question]]
id = "top_cidades_pedidos"
category = "ranking"
question = "Quais as 10 cidades com mais pedidos?"
ordered = true
sql = """
SELECT c.customer_city, count(*) AS n
FROM orders o JOIN customers c USING (customer_id)
GROUP BY 1 ORDER BY n DESC LIMIT 10
"""

[[question]]
id = "top_vendedores"
category = "ranking"
question = "Quais os 5 vendedores com maior receita (soma dos preços dos itens) em pedidos entregues? Mostre o seller_id."
ordered = true
sql = """
SELECT oi.seller_id, round(sum(oi.price), 2) AS receita
FROM order_items oi JOIN orders o USING (order_id)
WHERE o.order_status = 'delivered'
GROUP BY 1 ORDER BY receita DESC LIMIT 5
"""

[[question]]
id = "pagamentos_mais_usados"
category = "ranking"
question = "Quais as formas de pagamento mais usadas, da mais para a menos usada, pelo número de pagamentos?"
ordered = true
sql = """
SELECT payment_type, count(*) AS n FROM order_payments GROUP BY 1 ORDER BY n DESC
"""

[[question]]
id = "categoria_mais_produtos"
category = "ranking"
question = "Qual categoria tem o maior número de produtos cadastrados?"
# nome em português ou em inglês: as duas leituras estão certas
sql = [
    """SELECT product_category_name FROM products WHERE product_category_name IS NOT NULL
       GROUP BY 1 ORDER BY count(*) DESC LIMIT 1""",
    """SELECT t.product_category_name_english FROM products p
       JOIN category_translation t USING (product_category_name)
       GROUP BY 1 ORDER BY count(*) DESC LIMIT 1""",
]

# --- temporal ---------------------------------------------------------------------------------

[[question]]
id = "pedidos_por_mes_2017"
category = "temporal"
question = "Quantos pedidos foram feitos em cada mês de 2017?"
ordered = true
sql = """
SELECT count(*) FROM orders
WHERE year(order_purchase_timestamp) = 2017
GROUP BY date_trunc('month', order_purchase_timestamp)
ORDER BY date_trunc('month', order_purchase_timestamp)
"""

[[question]]
id = "faturamento_por_ano"
category = "temporal"
question = "Qual o faturamento (soma dos preços dos itens) de pedidos entregues em cada ano?"
ordered = true
# "entregues em cada ano" admite duas leituras: ano da compra ou ano da entrega
sql = [
    """SELECT year(o.order_purchase_timestamp), round(sum(oi.price), 2)
       FROM order_items oi JOIN orders o USING (order_id)
       WHERE o.order_status = 'delivered'
       GROUP BY 1 ORDER BY 1""",
    """SELECT year(o.order_delivered_customer_date), round(sum(oi.price), 2)
       FROM order_items oi JOIN orders o USING (order_id)
       WHERE o.order_status = 'delivered' AND o.order_delivered_customer_date IS NOT NULL
       GROUP BY 1 ORDER BY 1""",
]

[[question]]
id = "mes_pico_2017"
category = "temporal"
question = "Em qual mês de 2017 houve mais pedidos? Responda com o número do mês."
sql = """
SELECT month(order_purchase_timestamp) FROM orders
WHERE year(order_purchase_timestamp) = 2017
GROUP BY 1 ORDER BY count(*) DESC LIMIT 1
"""

[[question]]
id = "pedidos_2018_primeiro_semestre"
category = "temporal"
question = "Quantos pedidos foram feitos no primeiro semestre de 2018?"
sql = """
SELECT count(*) FROM orders
WHERE order_purchase_timestamp >= '2018-01-01' AND order_purchase_timestamp < '2018-07-01'
"""

# --- pegadinhas do schema ---------------------------------------------------------------------

[[question]]
id = "clientes_unicos"
category = "pegadinha"
question = "Quantos clientes únicos existem?"
# customer_id muda a cada pedido; cliente único é customer_unique_id
sql = "SELECT count(DISTINCT customer_unique_id) FROM customers"

[[question]]
id = "clientes_recorrentes"
category = "pegadinha"
question = "Quantos clientes fizeram mais de um pedido?"
sql = """
SELECT count(*) FROM (
    SELECT c.customer_unique_id
    FROM orders o JOIN customers c USING (customer_id)
    GROUP BY 1 HAVING count(DISTINCT o.order_id) > 1
)
"""

[[question]]
id = "percentual_atraso"
category = "pegadinha"
question = "Qual o percentual de pedidos entregues que chegaram depois da data prevista?"
# percentual (8,11) ou fração (0,0811): as duas formas estão certas
sql = [
    """SELECT round(100.0 * avg(CASE WHEN order_delivered_customer_date > order_estimated_delivery_date
                                     THEN 1 ELSE 0 END), 2)
       FROM orders WHERE order_status = 'delivered' AND order_delivered_customer_date IS NOT NULL""",
    """SELECT round(avg(CASE WHEN order_delivered_customer_date > order_estimated_delivery_date
                             THEN 1 ELSE 0 END), 4)
       FROM orders WHERE order_status = 'delivered' AND order_delivered_customer_date IS NOT NULL""",
]

[[question]]
id = "nota_atraso_vs_prazo"
category = "pegadinha"
question = "Qual a nota média das avaliações dos pedidos entregues com atraso e dos entregues no prazo?"
# só a coluna numérica: o rótulo de cada grupo (texto, booleano) varia e não importa
sql = """
SELECT round(avg(r.review_score), 2)
FROM orders o JOIN order_reviews r USING (order_id)
WHERE o.order_status = 'delivered' AND o.order_delivered_customer_date IS NOT NULL
GROUP BY o.order_delivered_customer_date > o.order_estimated_delivery_date
"""

[[question]]
id = "pedidos_sao_paulo_cidade"
category = "pegadinha"
question = "Quantos pedidos vieram de clientes da cidade de São Paulo?"
# cidades estão em minúsculas e sem acento: 'sao paulo'
sql = """
SELECT count(*) FROM orders o JOIN customers c USING (customer_id)
WHERE c.customer_city = 'sao paulo'
"""

